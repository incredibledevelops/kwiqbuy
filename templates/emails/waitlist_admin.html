{% extends "emails/base.html" %}
{% block title %}New Waitlist Signup{% endblock %}

{% block content %}
<h1 style="margin:0 0 8px;font-size:22px;color:#1e293b;">🎉 New Waitlist Signup</h1>
<p style="margin:0 0 24px;font-size:14px;color:#64748b;">
    Someone just joined the KwiqBuy launch list.
</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background:#eef2ff;border-radius:12px;padding:20px;margin-bottom:24px;">
    <tr>
        <td>
            <p style="margin:0 0 6px;font-size:12px;color:#6366f1;text-transform:uppercase;font-weight:700;letter-spacing:0.5px;">Email</p>
            <p style="margin:0 0 16px;font-size:16px;color:#1e293b;font-weight:600;">{{ user_email }}</p>

            <p style="margin:0 0 6px;font-size:12px;color:#6366f1;text-transform:uppercase;font-weight:700;letter-spacing:0.5px;">Source</p>
            <p style="margin:0;font-size:16px;color:#1e293b;font-weight:600;">{{ source }}</p>
        </td>
    </tr>
</table>

<a href="{{ base_url }}/admin/waitlist"
   style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;font-weight:700;font-size:14px;padding:12px 24px;border-radius:10px;">
    View Waitlist in Admin →
</a>
{% endblock %}
