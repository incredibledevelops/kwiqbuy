<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KwiqBuy Admin - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: {
                brand: {50:'#eef2ff',100:'#e0e7ff',500:'#6366f1',600:'#4f46e5',700:'#4338ca',900:'#312e81'},
                accent:{500:'#f59e0b',600:'#d97706'}
            }}}
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-2xl max-w-md w-full">
        <div class="flex items-center justify-center gap-2 mb-8">
            <div class="bg-brand-600 text-white p-2 rounded-xl">
                <i data-lucide="zap" class="w-7 h-7"></i>
            </div>
            <span class="text-3xl font-black tracking-tight text-slate-900">Kwiq<span class="text-brand-600">Admin</span></span>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-2">Email Address</label>
                <input id="email" type="email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-2">Password</label>
                <input id="password" type="password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
            </div>
            <p id="login-error" class="hidden text-red-600 text-sm font-semibold"></p>
            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-5 h-5"></i> Secure Login
            </button>
        </form>
    </div>
    <p class="text-slate-500 mt-6 text-sm">Authorized personnel only.</p>

    <script>
        lucide.createIcons();
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('login-error');
            err.classList.add('hidden');
            try {
                const res = await fetch('/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (data.ok) window.location.href = data.redirect;
                else { err.textContent = data.error; err.classList.remove('hidden'); }
            } catch (e) {
                err.textContent = "Network error."; err.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
